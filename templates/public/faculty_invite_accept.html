<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Set up your faculty account | EduERP</title>
    <style>
        body { margin: 0; background: #f3f6fb; color: #172033; font: 16px/1.5 Arial, sans-serif; }
        main { box-sizing: border-box; width: min(100% - 32px, 480px); margin: 8vh auto; padding: 32px; border-radius: 16px; background: white; box-shadow: 0 12px 40px #17203312; }
        h1 { margin: 0 0 8px; font-size: 26px; } p { color: #526079; }
        label { display: block; margin: 18px 0 6px; font-weight: 600; }
        input { box-sizing: border-box; width: 100%; padding: 12px; border: 1px solid #cbd3e1; border-radius: 8px; font-size: 16px; }
        button { width: 100%; margin-top: 22px; padding: 13px; border: 0; border-radius: 8px; background: #2459d3; color: white; font-size: 16px; font-weight: 700; cursor: pointer; }
        .error { padding: 10px 12px; border-radius: 8px; background: #fff1f0; color: #a52218; }
        .email { color: #172033; font-weight: 600; }
    </style>
</head>
<body>
<main>
    <h1>Set up your faculty account</h1>
    <p>{{ faculty.campus.institute.institute_name }} invited you to join {{ faculty.campus.campus_name }}.</p>
    <p>Your account will use <span class="email">{{ faculty.contact.email }}</span>.</p>
    {% for error in errors %}<p class="error">{{ error }}</p>{% endfor %}
    <form method="post">
        {% csrf_token %}
        <label for="password">Create password</label>
        <input id="password" name="password" type="password" autocomplete="new-password" required>
        <label for="password-confirm">Confirm password</label>
        <input id="password-confirm" name="password_confirm" type="password" autocomplete="new-password" required>
        <button type="submit">Create account</button>
    </form>
</main>
</body>
</html>
